name: Source checks

'on':
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node and synthetic image integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Set up Python for image integration tests
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install locked Node dependencies
        run: npm ci --ignore-scripts
      - name: Install pinned image-test dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements-test.txt
      # External corpus/SDK checks report skips when their opt-in assets are absent.
      # Swift, Simulator, phone and full Python recognition suites are separate checks.
      - name: Run source tests
        run: npm test
